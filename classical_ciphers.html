<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Classical Cipher Suite</title>
<style>
  :root {
    --dark-bg:   #1e2127;
    --panel-bg:  #282c34;
    --card-bg:   #2c313a;
    --text-fg:   #abb2bf;
    --white-fg:  #dcdfe4;
    --border:    #3e4452;
    --accent:    #61afef;
    --btn-enc:   #4f8ef7;
    --btn-dec:   #56b6c2;
    --btn-clr:   #e06c75;
    --btn-copy:  #98c379;
    --btn-swap:  #e5c07b;
    --green:     #98c379;
    --hint-fg:   #5c6370;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark-bg);
    color: var(--text-fg);
    font-family: 'Consolas', 'Courier New', monospace;
    min-height: 100vh;
  }
  /* ── Header ── */
  #header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 16px 20px 4px;
  }
  #header h1 {
    font-family: 'Courier New', monospace;
    font-size: 18px;
    font-weight: bold;
    color: var(--white-fg);
    letter-spacing: 1px;
  }
  #header span {
    font-size: 10px;
    color: var(--text-fg);
  }
  /* ── Main layout ── */
  #main {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 12px;
    padding: 8px 20px 20px;
    height: calc(100vh - 58px);
    min-height: 580px;
  }
  /* ── Sidebar ── */
  #sidebar {
    background: var(--panel-bg);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .sidebar-section-label {
    font-size: 9px;
    font-weight: bold;
    color: var(--accent);
    padding: 10px 8px 4px;
    letter-spacing: 1px;
  }
  .cipher-btn {
    display: block;
    width: calc(100% - 8px);
    margin: 1px 4px;
    padding: 8px 12px;
    background: var(--panel-bg);
    color: var(--text-fg);
    border: none;
    text-align: left;
    font-family: 'Consolas', monospace;
    font-size: 10px;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.1s;
  }
  .cipher-btn:hover { background: var(--card-bg); color: var(--white-fg); }
  .cipher-btn.active {
    background: var(--card-bg);
    font-weight: bold;
  }
  .sidebar-sep {
    height: 1px;
    background: var(--border);
    margin: 10px 8px;
  }
  .tool-btn {
    display: block;
    width: calc(100% - 8px);
    margin: 1px 4px;
    padding: 6px 12px;
    background: var(--card-bg);
    color: var(--text-fg);
    border: none;
    text-align: left;
    font-family: 'Consolas', monospace;
    font-size: 9px;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.1s;
  }
  .tool-btn:hover { background: var(--border); color: var(--white-fg); }
  /* ── Right panel ── */
  #panel {
    display: flex;
    flex-direction: column;
    gap: 0;
    background: var(--dark-bg);
    overflow-y: auto;
  }
  /* ── Desc card ── */
  #desc-card {
    background: var(--card-bg);
    padding: 8px 12px;
    margin-bottom: 8px;
    font-size: 9px;
    color: var(--hint-fg);
    white-space: pre-line;
    border-radius: 2px;
    line-height: 1.5;
  }
  /* ── Key row ── */
  #key-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  #key-label {
    font-size: 10px;
    font-weight: bold;
    color: var(--accent);
    white-space: nowrap;
  }
  #key-entry {
    flex: 1;
    background: var(--card-bg);
    border: none;
    outline: none;
    color: var(--white-fg);
    font-family: 'Consolas', monospace;
    font-size: 11px;
    padding: 6px 8px;
  }
  #key-hint {
    font-size: 9px;
    color: var(--hint-fg);
    white-space: nowrap;
  }
  /* ── Vigenère mode row ── */
  #vig-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 4px;
    font-size: 10px;
  }
  #vig-row label { font-size: 10px; color: var(--accent); font-weight: bold; }
  .vig-radio { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-fg); }
  .vig-radio input { cursor: pointer; accent-color: var(--accent); }
  /* ── Labels ── */
  .section-label {
    font-size: 10px;
    font-weight: bold;
    color: var(--text-fg);
    margin-bottom: 2px;
    margin-top: 4px;
  }
  /* ── Textareas ── */
  .text-frame {
    background: var(--card-bg);
    border-radius: 2px;
    display: flex;
    position: relative;
    margin-bottom: 8px;
  }
  .text-frame textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--white-fg);
    font-family: 'Consolas', monospace;
    font-size: 11px;
    padding: 8px;
    resize: none;
    height: 110px;
    line-height: 1.5;
    scrollbar-width: thin;
    scrollbar-color: var(--border) var(--card-bg);
  }
  #res-text {
    color: var(--green) !important;
  }
  /* ── Buttons row ── */
  #btn-row {
    display: flex;
    gap: 8px;
    margin: 4px 0 8px;
    flex-wrap: wrap;
  }
  .action-btn {
    background: var(--btn-enc);
    color: #1e2127;
    border: none;
    padding: 6px 0;
    width: 130px;
    font-family: 'Consolas', monospace;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 2px;
    transition: filter 0.15s;
  }
  .action-btn:hover { filter: brightness(1.15); }
  /* ── Result label row ── */
  #out-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
  }
  #status-lbl {
    font-size: 9px;
    color: var(--green);
  }
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <h1>⚙  CLASSICAL CIPHER SUITE</h1>
  <span>6 phương pháp mã hóa cổ điển</span>
</div>

<!-- Main layout -->
<div id="main">

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-section-label">  PHƯƠNG PHÁP</div>

    <button class="cipher-btn active" data-cipher="caesar"       style="--c:#4f8ef7">🔐  Caesar Cipher</button>
    <button class="cipher-btn"        data-cipher="mono"         style="--c:#e06c75">🔑  Monoalphabetic</button>
    <button class="cipher-btn"        data-cipher="vigenere"     style="--c:#98c379">🗝️  Vigenère Cipher</button>
    <button class="cipher-btn"        data-cipher="playfair"     style="--c:#e5c07b">♟️  Playfair Cipher</button>
    <button class="cipher-btn"        data-cipher="otp"          style="--c:#c678dd">🎲  One-Time Pad</button>
    <button class="cipher-btn"        data-cipher="railfence"    style="--c:#56b6c2">🚧  Rail Fence Cipher</button>

    <div class="sidebar-sep"></div>
    <div class="sidebar-section-label">  CÔNG CỤ</div>
    <button class="tool-btn" id="gen-key-btn">🎲 Tạo khóa ngẫu nhiên</button>
    <button class="tool-btn" id="clear-btn">🗑  Xóa tất cả</button>
  </div>

  <!-- Right panel -->
  <div id="panel">

    <!-- Desc card -->
    <div id="desc-card"></div>

    <!-- Key row -->
    <div id="key-row">
      <span id="key-label">KHÓA K:</span>
      <input id="key-entry" type="text" autocomplete="off" spellcheck="false"/>
      <span id="key-hint"></span>
    </div>

    <!-- Vigenère mode (hidden by default) -->
    <div id="vig-row" style="display:none">
      <label>CHẾ ĐỘ:</label>
      <label class="vig-radio"><input type="radio" name="vigmode" value="lap" checked/> 🔁  Lặp khóa (Repeating)</label>
      <label class="vig-radio"><input type="radio" name="vigmode" value="sinh"/> 🔑  Sinh khóa (Autokey)</label>
    </div>

    <!-- Message input -->
    <div class="section-label">BẢN TIN M  (nhập vào):</div>
    <div class="text-frame">
      <textarea id="msg-text" placeholder="Nhập bản tin tại đây..."></textarea>
    </div>

    <!-- Action buttons -->
    <div id="btn-row">
      <button class="action-btn" id="enc-btn"  style="background:#4f8ef7">🔒  MÃ HÓA</button>
      <button class="action-btn" id="dec-btn"  style="background:#56b6c2">🔓  GIẢI MÃ</button>
      <button class="action-btn" id="copy-btn" style="background:#98c379; width:148px">📋  Sao chép KQ</button>
      <button class="action-btn" id="swap-btn" style="background:#e5c07b; width:110px">⇅  Hoán đổi</button>
    </div>

    <!-- Result output -->
    <div id="out-row">
      <span class="section-label">KẾT QUẢ  (đầu ra):</span>
      <span id="status-lbl"></span>
    </div>
    <div class="text-frame">
      <textarea id="res-text" readonly></textarea>
    </div>

  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
//  CIPHER IMPLEMENTATIONS  (ported 1:1 from Python)
// ─────────────────────────────────────────────────────────────

const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

// ── Caesar ──────────────────────────────────────────────────
function caesarProcess(text, key, encrypt) {
  const k = parseInt(key, 10);
  if (isNaN(k)) throw new Error('Khóa Caesar phải là số nguyên (ví dụ: 3)');
  let shift = ((k % 26) + 26) % 26;
  if (!encrypt) shift = (26 - shift) % 26;
  return text.split('').map(ch => {
    if (/[A-Za-z]/.test(ch)) {
      const base = ch === ch.toUpperCase() ? 65 : 97;
      return String.fromCharCode((ch.charCodeAt(0) - base + shift) % 26 + base);
    }
    return ch;
  }).join('');
}

// ── Monoalphabetic ───────────────────────────────────────────
function monoBuildTable(key) {
  const ku = key.toUpperCase();
  if (!/^[A-Z]+$/.test(ku)) throw new Error('Khóa Monoalphabetic chỉ được chứa chữ cái\nVí dụ: ZEBRA hoặc QWERTYUIOPASDFGHJKLZXCVBNM');
  const seen = new Set();
  const order = [];
  for (const ch of ku) { if (!seen.has(ch)) { seen.add(ch); order.push(ch); } }
  for (const ch of ABC) { if (!seen.has(ch)) { seen.add(ch); order.push(ch); } }
  const enc = {}, dec = {};
  for (let i = 0; i < 26; i++) { enc[ABC[i]] = order[i]; dec[order[i]] = ABC[i]; }
  return { enc, dec };
}
function monoProcess(text, key, encrypt) {
  const { enc, dec } = monoBuildTable(key.trim());
  const table = encrypt ? enc : dec;
  return text.split('').map(ch => {
    const up = ch.toUpperCase();
    if (up in table) {
      const mapped = table[up];
      return ch === ch.toUpperCase() ? mapped : mapped.toLowerCase();
    }
    return ch;
  }).join('');
}

// ── Vigenère ─────────────────────────────────────────────────
function vigenereProcess(text, key, encrypt, autokey = false) {
  key = key.toUpperCase().trim();
  if (!key || !/^[A-Z]+$/.test(key)) throw new Error('Khóa Vigenère chỉ được chứa chữ cái (ví dụ: PHAMAG)');
  const result = [];
  let ki = 0;

  if (autokey) {
    if (encrypt) {
      const plainLetters = text.split('').filter(c => /[A-Za-z]/.test(c)).map(c => c.toUpperCase());
      const keyStream = [...key, ...plainLetters];
      for (const ch of text) {
        if (/[A-Za-z]/.test(ch)) {
          const shift = keyStream[ki].charCodeAt(0) - 65;
          const base = ch === ch.toUpperCase() ? 65 : 97;
          result.push(String.fromCharCode((ch.charCodeAt(0) - base + shift) % 26 + base));
          ki++;
        } else { result.push(ch); }
      }
    } else {
      const keyStream = [...key];
      for (const ch of text) {
        if (/[A-Za-z]/.test(ch)) {
          const shift = keyStream[ki].charCodeAt(0) - 65;
          const base = ch === ch.toUpperCase() ? 65 : 97;
          const plain = String.fromCharCode(((ch.toUpperCase().charCodeAt(0) - 65 - shift + 26) % 26) + 65);
          const out = ch === ch.toUpperCase() ? plain : plain.toLowerCase();
          result.push(out);
          keyStream.push(plain);
          ki++;
        } else { result.push(ch); }
      }
    }
  } else {
    for (const ch of text) {
      if (/[A-Za-z]/.test(ch)) {
        let shift = key[ki % key.length].charCodeAt(0) - 65;
        if (!encrypt) shift = -shift;
        const base = ch === ch.toUpperCase() ? 65 : 97;
        result.push(String.fromCharCode(((ch.charCodeAt(0) - base + shift + 26) % 26) + base));
        ki++;
      } else { result.push(ch); }
    }
  }
  return result.join('');
}

// ── Playfair ─────────────────────────────────────────────────
function playfairBuildMatrix(key) {
  const ku = key.toUpperCase().replace(/J/g, 'I');
  const seen = new Set();
  const order = [];
  for (const ch of ku + ABC) {
    if (ch === 'J') continue;
    if (!seen.has(ch)) { seen.add(ch); order.push(ch); }
  }
  const matrix = [];
  for (let i = 0; i < 5; i++) matrix.push(order.slice(i*5, i*5+5));
  const pos = {};
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) pos[matrix[r][c]] = [r, c];
  return { matrix, pos };
}
function playfairPrepare(text) {
  const t = text.toUpperCase().replace(/J/g, 'I').replace(/[^A-Z]/g, '');
  const pairs = [];
  let i = 0;
  while (i < t.length) {
    const a = t[i];
    if (i + 1 < t.length) {
      const b = t[i+1];
      if (a === b) { pairs.push(a + 'X'); i += 1; }
      else { pairs.push(a + b); i += 2; }
    } else { pairs.push(a + 'X'); i += 1; }
  }
  return pairs.join('');
}
function playfairProcess(text, key, encrypt) {
  if (!/^[A-Za-z]+$/.test(key)) throw new Error('Khóa Playfair chỉ được chứa chữ cái (ví dụ: MONARCHY)');
  const { matrix, pos } = playfairBuildMatrix(key.trim());
  const prepared = playfairPrepare(text);
  const step = encrypt ? 1 : -1;
  const result = [];
  for (let i = 0; i < prepared.length; i += 2) {
    const a = prepared[i], b = prepared[i+1];
    const [r1, c1] = pos[a], [r2, c2] = pos[b];
    if (r1 === r2) {
      result.push(matrix[r1][(c1 + step + 5) % 5]);
      result.push(matrix[r2][(c2 + step + 5) % 5]);
    } else if (c1 === c2) {
      result.push(matrix[(r1 + step + 5) % 5][c1]);
      result.push(matrix[(r2 + step + 5) % 5][c2]);
    } else {
      result.push(matrix[r1][c2]);
      result.push(matrix[r2][c1]);
    }
  }
  return result.join('');
}

// ── OTP ──────────────────────────────────────────────────────
function otpProcess(text, key, encrypt) {
  const keyClean = key.toUpperCase().trim();
  if (!keyClean || !/^[A-Z]+$/.test(keyClean))
    throw new Error('Khóa OTP chỉ được chứa chữ cái A-Z\nDùng nút 🎲 để tự sinh khóa ngẫu nhiên.');
  const letterCount = text.split('').filter(c => /[A-Za-z]/.test(c)).length;
  if (keyClean.length < letterCount)
    throw new Error(`Khóa OTP phải có ít nhất ${letterCount} chữ cái\n(bản tin có ${letterCount} chữ cái, khóa chỉ ${keyClean.length} ký tự)`);
  const result = [];
  let ki = 0;
  for (const ch of text) {
    if (/[A-Za-z]/.test(ch)) {
      let shift = keyClean[ki].charCodeAt(0) - 65;
      if (!encrypt) shift = -shift;
      const base = ch === ch.toUpperCase() ? 65 : 97;
      result.push(String.fromCharCode(((ch.charCodeAt(0) - base + shift + 26) % 26) + base));
      ki++;
    } else { result.push(ch); }
  }
  return result.join('');
}

// ── Rail Fence ───────────────────────────────────────────────
function railFenceProcess(text, key, encrypt) {
  const rails = parseInt(key, 10);
  if (isNaN(rails) || rails < 2) throw new Error('Khóa Rail Fence phải là số nguyên ≥ 2 (ví dụ: 3)');
  const letters = text.split('').filter(c => /[A-Za-z]/.test(c)).map(c => c.toUpperCase());
  const n = letters.length;

  if (encrypt) {
    const fence = Array.from({ length: rails }, () => []);
    let rail = 0, direction = 1;
    for (const ch of letters) {
      fence[rail].push(ch);
      if (rail === 0) direction = 1;
      else if (rail === rails - 1) direction = -1;
      rail += direction;
    }
    const ciphertext = fence.map(r => r.join('')).join('');
    const lines = fence.map((r, i) => `Hàng ${i+1}: ${r.join('')}`);
    lines.push('');
    lines.push(`Bản mã: ${ciphertext}`);
    return lines.join('\n');
  } else {
    const cipherLetters = text.split('').filter(c => /[A-Za-z]/.test(c)).map(c => c.toUpperCase());
    const m = cipherLetters.length;
    if (m === 0) throw new Error('Bản mã để giải mã không được để trống.');
    const pattern = [];
    let rail = 0, direction = 1;
    for (let i = 0; i < m; i++) {
      pattern.push(rail);
      if (rail === 0) direction = 1;
      else if (rail === rails - 1) direction = -1;
      rail += direction;
    }
    const indices = Array.from({ length: m }, (_, i) => i).sort((a, b) => pattern[a] - pattern[b]);
    const result = new Array(m).fill('');
    for (let i = 0; i < m; i++) result[indices[i]] = cipherLetters[i];
    return result.join('');
  }
}

// ─────────────────────────────────────────────────────────────
//  CIPHER CONFIG  (mirrors Python CIPHERS dict)
// ─────────────────────────────────────────────────────────────
const CIPHERS = {
  caesar: {
    process: (t, k, e) => caesarProcess(t, k, e),
    key_hint: '←  Số nguyên, ví dụ: 3',
    desc: 'Dịch chuyển mỗi ký tự đi K vị trí trong bảng chữ cái.\nE(x) = (x + K) mod 26   |   Khóa: số nguyên (vd: 3)',
    color: '#4f8ef7',
  },
  mono: {
    process: (t, k, e) => monoProcess(t, k, e),
    key_hint: '←  Từ khóa chữ cái bất kỳ, vd: ZEBRA',
    desc: 'Thay thế mỗi chữ cái theo bảng hoán vị xây từ từ khóa (keyword).\nKhóa: chuỗi chữ cái bất kỳ — tự xây bảng 26 ký tự (vd: ZEBRA)',
    color: '#e06c75',
  },
  vigenere: {
    process: (t, k, e, autokey) => vigenereProcess(t, k, e, autokey),
    key_hint: '←  Chuỗi chữ cái, vd: KEY',
    desc: 'Dùng từ khóa lặp lại, mỗi ký tự dùng dịch chuyển riêng.\nE(i) = (M[i] + K[i mod |K|]) mod 26   |   Khóa: chữ cái (vd: KEY)',
    color: '#98c379',
    isVigenere: true,
  },
  playfair: {
    process: (t, k, e) => playfairProcess(t, k, e),
    key_hint: '←  Chuỗi chữ cái, vd: MONARCHY',
    desc: 'Mã hóa từng cặp ký tự (bigram) trên ma trận 5×5, I=J.\nKhóa: chuỗi chữ cái tạo ma trận (vd: MONARCHY)',
    color: '#e5c07b',
  },
  otp: {
    process: (t, k, e) => otpProcess(t, k, e),
    key_hint: '←  Chuỗi chữ cái, số chữ cái ≥ bản tin',
    desc: 'Cộng modular từng chữ cái với khóa cùng độ dài — tuyệt đối an toàn.\nE(i)=(M[i]+K[i]) mod 26 | Khóa: chữ cái A-Z, dài ≥ số chữ cái bản tin',
    color: '#c678dd',
  },
  railfence: {
    process: (t, k, e) => railFenceProcess(t, k, e),
    key_hint: '←  Số hàng nguyên ≥ 2, vd: 3',
    desc: 'Viết chữ cái theo đường ziczac qua K hàng, đọc từng hàng làm bản mã.\nKết quả hiển thị từng hàng rõ ràng. Giải mã: nhập chuỗi bản mã.',
    color: '#56b6c2',
  },
};

// ─────────────────────────────────────────────────────────────
//  APP STATE & HELPERS
// ─────────────────────────────────────────────────────────────
let selectedCipher = 'caesar';

const descCard  = document.getElementById('desc-card');
const keyEntry  = document.getElementById('key-entry');
const keyHint   = document.getElementById('key-hint');
const msgText   = document.getElementById('msg-text');
const resText   = document.getElementById('res-text');
const statusLbl = document.getElementById('status-lbl');
const vigRow    = document.getElementById('vig-row');

function randLetters(n) {
  let s = '';
  for (let i = 0; i < n; i++) s += ABC[Math.floor(Math.random() * 26)];
  return s;
}

function onCipherChange(name) {
  selectedCipher = name;
  const info = CIPHERS[name];
  descCard.textContent = info.desc;
  keyHint.textContent = '  ' + info.key_hint;
  statusLbl.textContent = '';
  statusLbl.style.color = 'var(--green)';

  // Update sidebar button styles
  document.querySelectorAll('.cipher-btn').forEach(btn => {
    const isActive = btn.dataset.cipher === name;
    btn.classList.toggle('active', isActive);
    btn.style.color = isActive ? info.color : '';
    btn.style.fontWeight = isActive ? 'bold' : '';
  });

  // Show/hide Vigenère mode toggle
  vigRow.style.display = info.isVigenere ? 'flex' : 'none';
}

function getVigMode() {
  return document.querySelector('input[name="vigmode"]:checked').value;
}

function setResult(text) {
  resText.value = text;
}

function run(encrypt) {
  const msg = msgText.value;
  const key = keyEntry.value;
  if (!msg.trim()) { alert('Vui lòng nhập bản tin M.'); return; }
  if (!key.trim()) { alert('Vui lòng nhập khóa K.'); return; }

  const info = CIPHERS[selectedCipher];
  try {
    let result;
    if (info.isVigenere) {
      const autokey = getVigMode() === 'sinh';
      result = info.process(msg, key, encrypt, autokey);
    } else {
      result = info.process(msg, key, encrypt);
    }
    setResult(result);
    const mode = encrypt ? '✅ Mã hóa' : '✅ Giải mã';
    statusLbl.style.color = 'var(--green)';
    statusLbl.textContent = `${mode} thành công  (${result.length} ký tự)`;
  } catch (e) {
    alert('Lỗi khóa / dữ liệu:\n' + e.message);
    statusLbl.style.color = 'var(--btn-clr)';
    statusLbl.textContent = '❌ Lỗi';
  }
}

function copyResult() {
  const result = resText.value;
  if (!result.trim()) { alert('Chưa có kết quả để sao chép.'); return; }
  navigator.clipboard.writeText(result).then(() => {
    statusLbl.style.color = '#e5c07b';
    statusLbl.textContent = '📋 Đã sao chép vào clipboard!';
  }).catch(() => {
    resText.select();
    document.execCommand('copy');
    statusLbl.style.color = '#e5c07b';
    statusLbl.textContent = '📋 Đã sao chép vào clipboard!';
  });
}

function swap() {
  const result = resText.value;
  if (!result.trim()) return;
  msgText.value = result;
  setResult('');
  statusLbl.style.color = '#e5c07b';
  statusLbl.textContent = '⇅ Đã hoán đổi đầu vào / đầu ra';
}

function clearAll() {
  msgText.value = '';
  keyEntry.value = '';
  setResult('');
  statusLbl.textContent = '';
}

function generateKey() {
  const c = selectedCipher;
  keyEntry.value = '';
  if (c === 'caesar') {
    keyEntry.value = String(1 + Math.floor(Math.random() * 25));
  } else if (c === 'mono') {
    keyEntry.value = randLetters(5 + Math.floor(Math.random() * 4));
  } else if (c === 'vigenere') {
    keyEntry.value = randLetters(4 + Math.floor(Math.random() * 5));
  } else if (c === 'playfair') {
    keyEntry.value = randLetters(5 + Math.floor(Math.random() * 6));
  } else if (c === 'otp') {
    const msg = msgText.value;
    const letterCount = msg.split('').filter(ch => /[A-Za-z]/.test(ch)).length;
    const n = Math.max(letterCount, 16);
    keyEntry.value = randLetters(n);
  } else if (c === 'railfence') {
    keyEntry.value = String(2 + Math.floor(Math.random() * 4));
  }
}

// ─────────────────────────────────────────────────────────────
//  EVENT LISTENERS
// ─────────────────────────────────────────────────────────────
document.querySelectorAll('.cipher-btn').forEach(btn => {
  btn.addEventListener('click', () => onCipherChange(btn.dataset.cipher));
});
document.getElementById('enc-btn').addEventListener('click', () => run(true));
document.getElementById('dec-btn').addEventListener('click', () => run(false));
document.getElementById('copy-btn').addEventListener('click', copyResult);
document.getElementById('swap-btn').addEventListener('click', swap);
document.getElementById('clear-btn').addEventListener('click', clearAll);
document.getElementById('gen-key-btn').addEventListener('click', generateKey);

// Init
onCipherChange('caesar');
</script>
</body>
</html>
